name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  graphify-out-untouched:
    # graphify-out/ is regenerated and committed on main by
    # update-graph.yml after merge; a PR that also changes it conflicts with
    # that bot's commits. Keep it out of PRs (see scripts/install-git-hooks.sh).
    name: graphify-out not modified
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject graphify-out changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD -- graphify-out/ | head -20)"
          if [ -n "$changed" ]; then
            echo "::error::This PR modifies graphify-out/, which is regenerated on main after merge. Drop those changes (e.g. git checkout origin/main -- graphify-out) and reinstall hooks with ./scripts/install-git-hooks.sh."
            echo "$changed"
            exit 1
          fi

  release-script:
    name: Release script tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test scripts/next-version.sh
        run: bash scripts/test-next-version.sh

  lint:
    name: Go Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          args: ./...

  unit-tests:
    name: Go Unit Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Run unit tests
        run: go test -v ./...
